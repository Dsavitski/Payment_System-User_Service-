spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}


spring.liquibase.enabled=true

server.port=${SERVER_PORT:8082}

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/payment-system
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/payment-system/protocol/openid-connect/certs